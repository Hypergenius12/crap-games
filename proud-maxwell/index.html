<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>SharpOS</title>
    <link rel="stylesheet" href="styles.css?v=4">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>
<body>
    <div id="boot-screen">
        <div class="boot-logo">TITANIUM OS</div>
        <div class="boot-loading">Initializing System...</div>
        <div class="boot-progress-container">
            <div class="boot-progress-bar"></div>
        </div>
    </div>

    <div id="desktop">
        <!-- Desktop icons will go here -->
    </div>
    
    <div id="window-container">
        <!-- Windows will be injected here -->
    </div>

    <div id="start-menu">
        <div class="start-menu-items" id="start-menu-items">
            <!-- Start menu items will be injected here -->
        </div>
    </div>

    <div id="taskbar">
        <button id="start-button">SYSTEM</button>
        <div class="taskbar-divider"></div>
        <div id="taskbar-apps"></div>
        <div class="taskbar-divider"></div>
        <div id="system-tray">
            <span id="tray-net">NET:OK</span>
            <span id="tray-pwr">PWR:99%</span>
            <span id="clock">00:00</span>
        </div>
    </div>

    <!-- Scripts -->
    <script src="system/sfx.js?v=19"></script>
    <script src="system/webgl.js?v=19"></script>
    <script src="system/vfs.js?v=19"></script>
    <script src="system/contextMenu.js?v=19"></script>
    <script src="system/windowManager.js?v=19"></script>
    <script src="apps/cmd.js?v=19"></script>
    <script src="apps/notepad.js?v=19"></script>
    <script src="apps/explorer.js?v=19"></script>
    <script src="apps/calc.js?v=19"></script>
    <script src="apps/sysmon.js?v=19"></script>
    <script src="apps/paint.js?v=19"></script>
    <script src="apps/imageviewer.js?v=19"></script>
    <script src="apps/settings.js?v=19"></script>
    <script src="apps/trash.js?v=19"></script>
    <script src="desktop.js?v=19"></script>
</body>
</html>
