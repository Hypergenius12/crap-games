<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE REALM OF SHADOWS // V18.0 WEB</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚔️</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Syncopate:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="terminal-container">
        <!-- Top Status Bar with Meters & Stats -->
        <header class="status-bar" id="status-bar">
            <!-- Dynamically populated by JS -->
        </header>

        <!-- Main Narrative & Interaction Viewport -->
        <div class="main-viewport">
            <section class="output-console" id="output-console">
                <!-- Text lines, story, combat log -->
            </section>
        </div>

        <!-- Action Control Deck & Hotkey Grid -->
        <nav class="action-deck" id="action-deck">
            <div class="quick-tabs" id="quick-tabs">
                <!-- Quick Location / System Tabs -->
            </div>
            <div class="action-grid" id="action-grid">
                <!-- Interactive Action Buttons -->
            </div>
        </nav>
    </main>

    <script src="app.js"></script>
</body>
</html>
